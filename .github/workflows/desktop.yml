name: Desktop (Apple Silicon)

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Test native storage
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build ad-hoc signed DMG (not notarized)
        env:
          APPLE_SIGNING_IDENTITY: '-'
          VERSION: ${{ steps.version.outputs.version }}
        run: npx tauri build --target aarch64-apple-darwin --bundles dmg --config "{\"version\":\"$VERSION\"}" -- --locked
      - name: Stage release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          cp "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Gloss_${VERSION}_aarch64.dmg" "release-assets/Gloss_${VERSION}_aarch64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Gloss_${{ steps.version.outputs.version }}_aarch64
          path: release-assets/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Gloss_*_aarch64
          path: release-assets
          merge-multiple: true
      - name: Create tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.dmg \
            --title "Gloss ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Apple Silicon macOS build. Ad-hoc signed, not Apple notarized; macOS Gatekeeper may require explicitly allowing this app in Privacy & Security after opening it."
